[workspace]
resolver = "2"
members = [
    "crates/connectome-core",
    "crates/connectome-cli",
]
default-members = ["crates/connectome-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AMDphreak/connectome-fs"
authors = ["AMDphreak"]

[workspace.dependencies]
connectome-core = { path = "crates/connectome-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
